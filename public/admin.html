<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Grameen Shop Admin</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

<header>
  <a class="logo" href="/">
    GRAMEEN <span>SHOP</span>
  </a>

  <span style="margin-left:auto">
    Admin Dashboard
  </span>
</header>

<main class="section">

  <!-- LOGIN -->
  <div id="login">

    <h2>Admin Login</h2>

    <form id="loginForm">

      <input
        name="username"
        placeholder="Username"
        required
      >

      <input
        name="password"
        type="password"
        placeholder="Password"
        required
      >

      <button class="btn" type="submit">
        Login
      </button>

    </form>

  </div>


  <!-- DASHBOARD -->
  <div id="dash" class="hidden">

    <div class="head">

      <h2>Orders</h2>

      <button
        class="btn"
        onclick="logout()"
      >
        Logout
      </button>

    </div>


    <!-- ORDERS -->
    <div id="orders"></div>


    <!-- ADD PRODUCT -->
    <h2 style="margin-top:60px">
      Add New Product
    </h2>

    <form id="productForm">

      <input
        name="name"
        placeholder="Product name"
        required
      >

      <input
        name="category"
        placeholder="Category e.g. Fashion"
        required
      >

      <input
        name="price"
        type="number"
        placeholder="Price"
        required
      >

      <input
        name="old_price"
        type="number"
        placeholder="Old price"
      >


      <!-- PRODUCT IMAGE -->

      <label
        style="
          display:block;
          margin-top:15px;
          margin-bottom:8px;
          font-weight:700;
        "
      >
        📷 Product Image
      </label>

      <input
        id="imageFile"
        type="file"
        accept="image/*"
        required
      >


      <!-- IMAGE PREVIEW -->

      <div
        id="imagePreview"
        style="
          margin:15px 0;
          display:none;
        "
      >

        <img
          id="previewImg"
          style="
            width:180px;
            height:180px;
            object-fit:cover;
            border-radius:15px;
            border:2px solid #ddd;
          "
        >

      </div>


      <!-- FALLBACK ICON -->

      <input
        name="icon"
        placeholder="Emoji e.g. 👕"
        value="🛍️"
      >


      <input
        name="stock"
        type="number"
        placeholder="Stock"
        required
      >


      <button
        id="addProductBtn"
        class="btn"
        type="submit"
      >
        ➕ Add Product
      </button>

    </form>


    <!-- PRODUCTS -->

    <h2 style="margin-top:50px">
      Products
    </h2>

    <div id="productsAdmin"></div>

  </div>

</main>


<script>

/* =====================================================
   CONFIGURATION
   ===================================================== */

const CLOUDINARY_CLOUD_NAME = "bzkcc09f";

const CLOUDINARY_UPLOAD_PRESET = "grameen_shop";


/* =====================================================
   API HELPER
   ===================================================== */

const api = (url, options) =>
  fetch(url, options).then(r => r.json());


/* =====================================================
   LOGIN CHECK
   ===================================================== */

async function init(){

  try{

    const x = await api("/api/admin/me");

    if(x.loggedIn){

      show();

    }

  }catch(error){

    console.error(error);

  }

}


/* =====================================================
   SHOW DASHBOARD
   ===================================================== */

function show(){

  document
    .getElementById("login")
    .classList.add("hidden");

  document
    .getElementById("dash")
    .classList.remove("hidden");

  load();

}


/* =====================================================
   LOGIN
   ===================================================== */

document
  .getElementById("loginForm")
  .onsubmit = async e => {

    e.preventDefault();

    const x = await api(
      "/api/admin/login",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify(
          Object.fromEntries(
            new FormData(e.target)
          )
        )
      }
    );

    if(x.ok){

      show();

    }else{

      alert(x.error);

    }

  };


/* =====================================================
   IMAGE PREVIEW
   ===================================================== */

document
  .getElementById("imageFile")
  .onchange = e => {

    const file = e.target.files[0];

    if(!file){

      imagePreview.style.display = "none";

      return;

    }

    if(file.size > 10 * 1024 * 1024){

      alert(
        "Image is too large. Please choose an image under 10MB."
      );

      e.target.value = "";

      return;

    }

    const reader = new FileReader();

    reader.onload = function(){

      previewImg.src = reader.result;

      imagePreview.style.display = "block";

    };

    reader.readAsDataURL(file);

  };


/* =====================================================
   UPLOAD IMAGE TO CLOUDINARY
   ===================================================== */

async function uploadToCloudinary(file){

  const formData = new FormData();

  formData.append(
    "file",
    file
  );

  formData.append(
    "upload_preset",
    CLOUDINARY_UPLOAD_PRESET
  );


  const response = await fetch(

    `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,

    {
      method:"POST",
      body:formData
    }

  );


  const data = await response.json();


  if(!response.ok){

    console.error(data);

    throw new Error(
      data.error?.message ||
      "Image upload failed."
    );

  }


  return data.secure_url;

}


/* =====================================================
   LOAD ORDERS + PRODUCTS
   ===================================================== */

async function load(){

  try{

    const os =
      await api("/api/admin/orders");


    document.getElementById("orders").innerHTML =

      os.map(o => `

        <div
          style="
            border:1px solid #ddd;
            border-radius:12px;
            padding:18px;
            margin:10px 0;
          "
        >

          <b>Order #${o.id}</b>
          —
          ${o.customer_name}
          —
          ${o.phone}

          <br>

          ${o.address}

          <br>

          Payment:
          ${o.payment}

          |

          Total:
          ৳${o.total.toLocaleString()}

          <br>

          Items:
          ${o.items.map(
            i => i.name + " × " + i.qty
          ).join(", ")}

          <br>

          <select
            onchange="status(${o.id},this.value)"
          >

            ${
              [
                "Pending",
                "Confirmed",
                "Packed",
                "Shipped",
                "Delivered",
                "Cancelled"
              ].map(
                s => `
                  <option
                    ${s === o.status ? "selected" : ""}
                  >
                    ${s}
                  </option>
                `
              ).join("")
            }

          </select>

        </div>

      `).join("")

      || "<p>No orders yet.</p>";


    /* PRODUCTS */

    const ps =
      await api("/api/products");


    document.getElementById("productsAdmin").innerHTML =

      ps.map(p => `

        <div
          style="
            padding:15px;
            border-bottom:1px solid #eee;
            display:flex;
            align-items:center;
            gap:14px;
          "
        >

          ${
            p.icon &&
            (
              p.icon.startsWith("http") ||
              p.icon.startsWith("data:image")
            )

            ?

            `<img
              src="${p.icon}"
              alt="${p.name}"
              style="
                width:70px;
                height:70px;
                object-fit:cover;
                border-radius:12px;
                border:1px solid #ddd;
              "
            >`

            :

            `<span style="font-size:38px">
              ${p.icon || "🛍️"}
            </span>`
          }


          <div>

            <b>${p.name}</b>

            <br>

            ${p.category}

            <br>

            ৳${Number(p.price).toLocaleString()}

            —

            Stock:
            ${p.stock}

          </div>


          <button
            onclick="del(${p.id})"
            style="margin-left:auto"
          >
            Hide
          </button>

        </div>

      `).join("");


  }catch(error){

    console.error(error);

    alert(
      "Could not load products/orders."
    );

  }

}


/* =====================================================
   ORDER STATUS
   ===================================================== */

async function status(id,s){

  await api(
    "/api/admin/orders/" + id,
    {
      method:"PATCH",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        status:s
      })
    }
  );

  load();

}


/* =====================================================
   ADD PRODUCT
   ===================================================== */

document
  .getElementById("productForm")
  .onsubmit = async e => {

    e.preventDefault();


    const button =
      document.getElementById("addProductBtn");


    const file =
      document.getElementById("imageFile")
      .files[0];


    if(!file){

      alert(
        "Please choose a product image."
      );

      return;

    }


    try{

      /* DISABLE BUTTON */

      button.disabled = true;

      button.textContent =
        "⏳ Uploading image...";


      /* UPLOAD IMAGE */

      const imageUrl =
        await uploadToCloudinary(file);


      console.log(
        "Cloudinary image:",
        imageUrl
      );


      /* PRODUCT DATA */

      const data =
        Object.fromEntries(
          new FormData(e.target)
        );


      /*
        Cloudinary URL is saved
        inside the existing icon field.
      */

      data.icon = imageUrl;


      /* ADD PRODUCT TO DATABASE */

      button.textContent =
        "⏳ Adding product...";


      const x =
        await api(
          "/api/admin/products",
          {
            method:"POST",

            headers:{
              "Content-Type":"application/json"
            },

            body:JSON.stringify(data)
          }
        );


      if(!x.ok){

        throw new Error(
          x.error ||
          "Product could not be added."
        );

      }


      /* SUCCESS */

      alert(
        "✅ Product and image added successfully!"
      );


      e.target.reset();


      document
        .getElementById("imagePreview")
        .style.display = "none";


      document
        .getElementById("previewImg")
        .src = "";


      button.disabled = false;

      button.textContent =
        "➕ Add Product";


      await load();


    }catch(error){

      console.error(error);

      alert(
        "❌ " +
        (
          error.message ||
          "Something went wrong."
        )
      );


      button.disabled = false;

      button.textContent =
        "➕ Add Product";

    }

  };


/* =====================================================
   HIDE PRODUCT
   ===================================================== */

async function del(id){

  if(
    !confirm(
      "Hide this product?"
    )
  ){

    return;

  }


  const x =
    await api(
      "/api/admin/products/" + id,
      {
        method:"DELETE"
      }
    );


  if(x.ok){

    load();

  }else{

    alert(
      x.error ||
      "Could not hide product."
    );

  }

}


/* =====================================================
   LOGOUT
   ===================================================== */

async function logout(){

  await api(
    "/api/admin/logout",
    {
      method:"POST"
    }
  );

  location.reload();

}


/* =====================================================
   START
   ===================================================== */

init();

</script>

</body>
</html>
