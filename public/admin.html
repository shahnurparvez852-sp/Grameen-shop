<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Grameen Shop Admin</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

<header>
  <a class="logo" href="/">
    GRAMEEN <span>SHOP</span>
  </a>

  <span style="margin-left:auto">
    Admin Dashboard
  </span>
</header>


<main class="section">

  <!-- LOGIN -->
  <div id="login">

    <h2>Admin Login</h2>

    <form id="loginForm">

      <input
        name="username"
        placeholder="Username"
        required
      >

      <input
        name="password"
        type="password"
        placeholder="Password"
        required
      >

      <button class="btn">
        Login
      </button>

    </form>

  </div>


  <!-- DASHBOARD -->
  <div id="dash" class="hidden">

    <div class="head">

      <h2>Orders</h2>

      <button
        class="btn"
        onclick="logout()"
      >
        Logout
      </button>

    </div>


    <!-- ORDERS -->
    <div id="orders"></div>


    <!-- PRODUCTS -->
    <h2 style="margin-top:60px">
      Add New Product
    </h2>


    <form id="productForm">

      <input
        name="name"
        placeholder="Product name"
        required
      >


      <input
        name="category"
        placeholder="Category e.g. Fashion"
        required
      >


      <input
        name="price"
        type="number"
        placeholder="Price"
        required
      >


      <input
        name="old_price"
        type="number"
        placeholder="Old price"
      >


      <!-- PRODUCT IMAGE -->
      <label style="display:block;margin-top:12px">
        📷 Product Image
      </label>

      <input
        id="imageFile"
        type="file"
        accept="image/*"
      >


      <!-- IMAGE PREVIEW -->
      <div
        id="imagePreview"
        style="
          margin:15px 0;
          display:none;
        "
      >

        <img
          id="previewImg"
          style="
            width:160px;
            height:160px;
            object-fit:cover;
            border-radius:15px;
            border:2px solid #ddd;
          "
        >

      </div>


      <!-- FALLBACK ICON -->
      <input
        name="icon"
        placeholder="Emoji e.g. 👕"
        value="🛍️"
      >


      <input
        name="stock"
        type="number"
        placeholder="Stock"
        required
      >


      <button
        class="btn"
        type="submit"
      >
        ➕ Add Product
      </button>

    </form>


    <h2 style="margin-top:50px">
      Products
    </h2>

    <div id="productsAdmin"></div>

  </div>

</main>


<script>

const api=(u,o)=>fetch(u,o).then(r=>r.json());


// LOGIN CHECK
async function init(){

  let x=await api("/api/admin/me");

  if(x.loggedIn){
    show();
  }

}


// SHOW DASHBOARD
function show(){

  login.classList.add("hidden");

  dash.classList.remove("hidden");

  load();

}


// LOGIN
loginForm.onsubmit=async e=>{

  e.preventDefault();

  let x=await api(
    "/api/admin/login",
    {
      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify(
        Object.fromEntries(
          new FormData(e.target)
        )
      )
    }
  );

  if(x.ok){

    show();

  }else{

    alert(x.error);

  }

};


// IMAGE PREVIEW
imageFile.onchange=e=>{

  const file=e.target.files[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=function(){

    previewImg.src=reader.result;

    imagePreview.style.display="block";

  };

  reader.readAsDataURL(file);

};


// RESIZE IMAGE
function resizeImage(file){

  return new Promise((resolve,reject)=>{

    const reader=new FileReader();

    reader.onload=e=>{

      const img=new Image();

      img.onload=()=>{

        const canvas=document.createElement("canvas");

        const max=800;

        let width=img.width;

        let height=img.height;


        if(width>height){

          if(width>max){

            height=height*max/width;

            width=max;

          }

        }else{

          if(height>max){

            width=width*max/height;

            height=max;

          }

        }


        canvas.width=width;

        canvas.height=height;


        const ctx=canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );


        resolve(
          canvas.toDataURL(
            "image/jpeg",
            0.75
          )
        );

      };

      img.onerror=reject;

      img.src=e.target.result;

    };

    reader.onerror=reject;

    reader.readAsDataURL(file);

  });

}


// LOAD ORDERS + PRODUCTS
async function load(){

  let os=await api("/api/admin/orders");


  orders.innerHTML=os.map(o=>`

    <div
      style="
        border:1px solid #ddd;
        border-radius:12px;
        padding:18px;
        margin:10px 0
      "
    >

      <b>Order #${o.id}</b>
      —
      ${o.customer_name}
      —
      ${o.phone}

      <br>

      ${o.address}

      <br>

      Payment:
      ${o.payment}

      |
      Total:
      ৳${o.total.toLocaleString()}

      <br>

      Items:
      ${o.items.map(
        i=>i.name+" × "+i.qty
      ).join(", ")}

      <br>

      <select
        onchange="status(${o.id},this.value)"
      >

        ${
          [
            "Pending",
            "Confirmed",
            "Packed",
            "Shipped",
            "Delivered",
            "Cancelled"
          ].map(
            s=>`
              <option
                ${s===o.status?"selected":""}
              >
                ${s}
              </option>
            `
          ).join("")
        }

      </select>

    </div>

  `).join("") || "<p>No orders yet.</p>";


  let ps=await api("/api/products");


  productsAdmin.innerHTML=ps.map(p=>`

    <div
      style="
        padding:12px;
        border-bottom:1px solid #eee;
        display:flex;
        align-items:center;
        gap:12px;
      "
    >

      ${
        p.icon &&
        p.icon.startsWith("data:image")
        ?
        `<img
          src="${p.icon}"
          style="
            width:60px;
            height:60px;
            object-fit:cover;
            border-radius:10px;
          "
        >`
        :
        `<span style="font-size:35px">
          ${p.icon}
        </span>`
      }

      <div>

        <b>${p.name}</b>

        <br>

        ৳${p.price}

        —
        Stock:
        ${p.stock}

      </div>

      <button
        onclick="del(${p.id})"
        style="margin-left:auto"
      >
        Hide
      </button>

    </div>

  `).join("");

}


// ORDER STATUS
async function status(id,s){

  await api(
    "/api/admin/orders/"+id,
    {
      method:"PATCH",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        status:s
      })
    }
  );

  load();

}


// ADD PRODUCT
productForm.onsubmit=async e=>{

  e.preventDefault();


  const file=imageFile.files[0];

  let imageData="";


  // Convert image to small data
  if(file){

    if(file.size>8*1024*1024){

      alert(
        "Image is too large. Please choose an image under 8MB."
      );

      return;

    }

    try{

      imageData=await resizeImage(file);

    }catch(err){

      alert("Could not process the image.");

      return;

    }

  }


  const data=Object.fromEntries(
    new FormData(e.target)
  );


  // Save image inside existing icon field
  if(imageData){

    data.icon=imageData;

  }


  let x=await api(
    "/api/admin/products",
    {
      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify(data)
    }
  );


  if(x.ok){

    alert("✅ Product added successfully!");

    e.target.reset();

    imagePreview.style.display="none";

    previewImg.src="";

    load();

  }else{

    alert(x.error);

  }

};


// HIDE PRODUCT
async function del(id){

  if(
    confirm(
      "Hide this product?"
    )
  ){

    await api(
      "/api/admin/products/"+id,
      {
        method:"DELETE"
      }
    );

    load();

  }

}


// LOGOUT
async function logout(){

  await api(
    "/api/admin/logout",
    {
      method:"POST"
    }
  );

  location.reload();

}


init();

</script>

</body>
</html>
