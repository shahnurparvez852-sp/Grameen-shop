<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parvez Shop Admin</title><link rel="stylesheet" href="/style.css"></head><body>
<header><a class="logo" href="/">PARVEZ SHOP</a><span style="margin-left:auto">Admin Dashboard</span></header><main class="section"><div id="login"><h2>Admin Login</h2><form id="loginForm"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button class="btn">Login</button></form></div>
<div id="dash" class="hidden"><div class="head"><h2>Orders</h2><button class="btn" onclick="logout()">Logout</button></div><div id="orders"></div><h2 style="margin-top:60px">Products</h2><form id="productForm"><input name="name" placeholder="Product name" required><input name="category" placeholder="Category" required><input name="price" type="number" placeholder="Price" required><input name="old_price" type="number" placeholder="Old price"><input name="icon" placeholder="Emoji e.g. 👕"><input name="stock" type="number" placeholder="Stock" required><button class="btn">Add Product</button></form><div id="productsAdmin"></div></div></main><script>
const api=(u,o)=>fetch(u,o).then(r=>r.json());
async function init(){let x=await api("/api/admin/me");if(x.loggedIn)show()}function show(){login.classList.add("hidden");dash.classList.remove("hidden");load()}
loginForm.onsubmit=async e=>{e.preventDefault();let x=await api("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if(x.ok)show();else alert(x.error)}
async function load(){let os=await api("/api/admin/orders");orders.innerHTML=os.map(o=>`<div style="border:1px solid #ddd;border-radius:12px;padding:18px;margin:10px 0"><b>Order #${o.id}</b> — ${o.customer_name} — ${o.phone}<br>${o.address}<br>Payment: ${o.payment} | Total: ৳${o.total.toLocaleString()}<br>Items: ${o.items.map(i=>i.name+" × "+i.qty).join(", ")}<br><select onchange="status(${o.id},this.value)">${["Pending","Confirmed","Packed","Shipped","Delivered","Cancelled"].map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></div>`).join("")||"<p>No orders yet.</p>";let ps=await api("/api/products");productsAdmin.innerHTML=ps.map(p=>`<div style="padding:12px;border-bottom:1px solid #eee">${p.icon} <b>${p.name}</b> — ৳${p.price} — Stock: ${p.stock} <button onclick="del(${p.id})">Hide</button></div>`).join("")}
async function status(id,s){await api("/api/admin/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:s})});load()}
productForm.onsubmit=async e=>{e.preventDefault();let x=await api("/api/admin/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if(x.ok){e.target.reset();load()}else alert(x.error)}
async function del(id){if(confirm("Hide this product?")){await api("/api/admin/products/"+id,{method:"DELETE"});load()}}
async function logout(){await api("/api/admin/logout",{method:"POST"});location.reload()}init();
</script></body></html>
