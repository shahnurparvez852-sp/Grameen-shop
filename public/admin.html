<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Grameen Shop Admin</title>

  <link rel="stylesheet" href="/style.css">

  <style>

    .admin-product{
      padding:18px;
      border:1px solid #e5e5e5;
      border-radius:16px;
      margin:12px 0;
      display:flex;
      align-items:center;
      gap:16px;
      background:#fff;
    }

    .admin-product-image{
      width:80px;
      height:80px;
      object-fit:cover;
      border-radius:12px;
      border:1px solid #ddd;
      flex-shrink:0;
    }

    .admin-product-info{
      flex:1;
    }

    .admin-product-info b{
      font-size:17px;
    }

    .product-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .edit-btn{
      border:0;
      padding:9px 14px;
      border-radius:8px;
      cursor:pointer;
      background:#111;
      color:#fff;
    }

    .hide-btn{
      border:0;
      padding:9px 14px;
      border-radius:8px;
      cursor:pointer;
      background:#eee;
    }

    .edit-box{
      margin-top:15px;
      padding:20px;
      border-radius:15px;
      background:#f7f7f7;
      border:1px solid #ddd;
    }

    .edit-box h3{
      margin-top:0;
    }

    .edit-box input{
      width:100%;
      box-sizing:border-box;
      margin:6px 0 12px;
    }

    .edit-image-preview{
      width:150px;
      height:150px;
      object-fit:cover;
      border-radius:12px;
      border:1px solid #ddd;
      margin:8px 0 15px;
    }

    .edit-buttons{
      display:flex;
      gap:10px;
      margin-top:12px;
    }

    .cancel-btn{
      border:0;
      padding:10px 16px;
      border-radius:8px;
      cursor:pointer;
      background:#ddd;
    }

    @media(max-width:700px){

      .admin-product{
        align-items:flex-start;
        flex-direction:column;
      }

      .admin-product-image{
        width:100px;
        height:100px;
      }

      .product-actions{
        width:100%;
      }

    }

  </style>

</head>

<body>

<header>

  <a class="logo" href="/">
    GRAMEEN <span>SHOP</span>
  </a>

  <span style="margin-left:auto">
    Admin Dashboard
  </span>

</header>


<main class="section">


  <!-- LOGIN -->

  <div id="login">

    <h2>Admin Login</h2>

    <form id="loginForm">

      <input
        name="username"
        placeholder="Username"
        required
      >

      <input
        name="password"
        type="password"
        placeholder="Password"
        required
      >

      <button
        class="btn"
        type="submit"
      >
        Login
      </button>

    </form>

  </div>


  <!-- DASHBOARD -->

  <div id="dash" class="hidden">


    <div class="head">

      <h2>Orders</h2>

      <button
        class="btn"
        onclick="logout()"
      >
        Logout
      </button>

    </div>


    <!-- ORDERS -->

    <div id="orders"></div>


    <!-- ADD PRODUCT -->

    <h2 style="margin-top:60px">
      Add New Product
    </h2>


    <form id="productForm">


      <input
        name="name"
        placeholder="Product name"
        required
      >


      <input
        name="category"
        placeholder="Category e.g. Fashion"
        required
      >


      <input
        name="price"
        type="number"
        placeholder="Price"
        required
      >


      <input
        name="old_price"
        type="number"
        placeholder="Old price"
      >


      <!-- PRODUCT IMAGE -->

      <label
        style="
          display:block;
          margin-top:15px;
          margin-bottom:8px;
          font-weight:700;
        "
      >
        📷 Product Image
      </label>


      <input
        id="imageFile"
        type="file"
        accept="image/*"
        required
      >


      <!-- IMAGE PREVIEW -->

      <div
        id="imagePreview"
        style="
          margin:15px 0;
          display:none;
        "
      >

        <img
          id="previewImg"
          style="
            width:180px;
            height:180px;
            object-fit:cover;
            border-radius:15px;
            border:2px solid #ddd;
          "
        >

      </div>


      <!-- FALLBACK ICON -->

      <input
        name="icon"
        placeholder="Emoji e.g. 👕"
        value="🛍️"
      >


      <input
        name="stock"
        type="number"
        placeholder="Stock"
        required
      >


      <button
        id="addProductBtn"
        class="btn"
        type="submit"
      >
        ➕ Add Product
      </button>


    </form>


    <!-- PRODUCTS -->

    <h2 style="margin-top:50px">
      Products
    </h2>


    <div id="productsAdmin"></div>


  </div>

</main>


<script>


/* =====================================================
   CONFIGURATION
   ===================================================== */

const CLOUDINARY_CLOUD_NAME = "bzkcc09f";

const CLOUDINARY_UPLOAD_PRESET = "grameen_shop";


/* =====================================================
   API HELPER
   ===================================================== */

const api = (url, options) =>
  fetch(url, options).then(async r => {

    const data = await r.json().catch(() => ({}));

    if(!r.ok){

      throw new Error(
        data.error || "Request failed"
      );

    }

    return data;

  });


/* =====================================================
   LOGIN CHECK
   ===================================================== */

async function init(){

  try{

    const x =
      await api("/api/admin/me");

    if(x.loggedIn){

      show();

    }

  }catch(error){

    console.error(error);

  }

}


/* =====================================================
   SHOW DASHBOARD
   ===================================================== */

function show(){

  document
    .getElementById("login")
    .classList.add("hidden");

  document
    .getElementById("dash")
    .classList.remove("hidden");

  load();

}


/* =====================================================
   LOGIN
   ===================================================== */

document
  .getElementById("loginForm")
  .onsubmit = async e => {

    e.preventDefault();

    try{

      const x =
        await api(
          "/api/admin/login",
          {
            method:"POST",

            headers:{
              "Content-Type":"application/json"
            },

            body:JSON.stringify(
              Object.fromEntries(
                new FormData(e.target)
              )
            )
          }
        );

      if(x.ok){

        show();

      }

    }catch(error){

      alert(error.message);

    }

  };


/* =====================================================
   IMAGE PREVIEW
   ===================================================== */

document
  .getElementById("imageFile")
  .onchange = e => {

    const file =
      e.target.files[0];

    if(!file){

      document
        .getElementById("imagePreview")
        .style.display = "none";

      return;

    }


    if(file.size > 10 * 1024 * 1024){

      alert(
        "Image is too large. Please choose an image under 10MB."
      );

      e.target.value = "";

      return;

    }


    const reader =
      new FileReader();


    reader.onload = function(){

      document
        .getElementById("previewImg")
        .src = reader.result;

      document
        .getElementById("imagePreview")
        .style.display = "block";

    };


    reader.readAsDataURL(file);

  };


/* =====================================================
   CLOUDINARY UPLOAD
   ===================================================== */

async function uploadToCloudinary(file){

  const formData =
    new FormData();


  formData.append(
    "file",
    file
  );


  formData.append(
    "upload_preset",
    CLOUDINARY_UPLOAD_PRESET
  );


  const response =
    await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
      {
        method:"POST",
        body:formData
      }
    );


  const data =
    await response.json();


  console.log(
    "Cloudinary response:",
    data
  );


  if(!response.ok){

    throw new Error(
      data.error?.message ||
      "Image upload failed."
    );

  }


  if(!data.secure_url){

    throw new Error(
      "Cloudinary did not return image URL."
    );

  }


  return data.secure_url;

}


/* =====================================================
   LOAD ORDERS + PRODUCTS
   ===================================================== */

async function load(){

  try{

    /* ORDERS */

    const os =
      await api(
        "/api/admin/orders"
      );


    document
      .getElementById("orders")
      .innerHTML =

      os.map(o => `

        <div
          style="
            border:1px solid #ddd;
            border-radius:12px;
            padding:18px;
            margin:10px 0;
          "
        >

          <b>
            Order #${o.id}
          </b>

          —
          ${o.customer_name}

          —
          ${o.phone}

          <br>

          ${o.address}

          <br>

          Payment:
          ${o.payment}

          |

          Total:
          ৳${Number(o.total).toLocaleString()}

          <br>

          Items:

          ${o.items.map(
            i =>
              i.name +
              " × " +
              i.qty
          ).join(", ")}

          <br>


          <select
            onchange="status(${o.id},this.value)"
          >

            ${
              [
                "Pending",
                "Confirmed",
                "Packed",
                "Shipped",
                "Delivered",
                "Cancelled"
              ]
              .map(
                s => `
                  <option
                    value="${s}"
                    ${s === o.status ? "selected" : ""}
                  >
                    ${s}
                  </option>
                `
              )
              .join("")
            }

          </select>

        </div>

      `).join("")

      ||

      "<p>No orders yet.</p>";


    /* PRODUCTS */

    const ps =
      await api(
        "/api/products"
      );


    document
      .getElementById("productsAdmin")
      .innerHTML =

      ps.map(p => `

        <div
          class="admin-product"
          id="product-${p.id}"
        >


          ${
            p.icon &&
            (
              p.icon.startsWith("http://") ||
              p.icon.startsWith("https://") ||
              p.icon.startsWith("data:image")
            )

            ?

            `<img
              class="admin-product-image"
              src="${p.icon}"
              alt="${escapeHtml(p.name)}"
            >`

            :

            `<div
              class="admin-product-image"
              style="
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:38px;
              "
            >
              ${escapeHtml(p.icon || "🛍️")}
            </div>`
          }


          <div class="admin-product-info">

            <b>
              ${escapeHtml(p.name)}
            </b>

            <br>

            ${escapeHtml(p.category)}

            <br>

            <strong>
              ৳${Number(p.price).toLocaleString()}
            </strong>

            ${
              Number(p.old_price) > 0
              ?
              `
                <del style="margin-left:8px">
                  ৳${Number(p.old_price).toLocaleString()}
                </del>
              `
              :
              ""
            }

            <br>

            Stock:
            ${Number(p.stock)}

          </div>


          <div class="product-actions">

            <button
              class="edit-btn"
              onclick="editProduct(${p.id})"
            >
              ✏️ Edit
            </button>


            <button
              class="hide-btn"
              onclick="del(${p.id})"
            >
              👁️ Hide
            </button>

          </div>


        </div>

      `).join("")

      ||

      "<p>No products found.</p>";


  }catch(error){

    console.error(error);

    alert(
      "Could not load products/orders: " +
      error.message
    );

  }

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   ORDER STATUS
   ===================================================== */

async function status(id,s){

  try{

    await api(
      "/api/admin/orders/" + id,
      {
        method:"PATCH",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          status:s
        })
      }
    );


    await load();

  }catch(error){

    alert(error.message);

  }

}


/* =====================================================
   ADD PRODUCT
   ===================================================== */

document
  .getElementById("productForm")
  .onsubmit = async e => {

    e.preventDefault();


    const button =
      document.getElementById(
        "addProductBtn"
      );


    const file =
      document
        .getElementById("imageFile")
        .files[0];


    if(!file){

      alert(
        "Please choose a product image."
      );

      return;

    }


    try{

      button.disabled = true;

      button.textContent =
        "⏳ Uploading image...";


      const imageUrl =
        await uploadToCloudinary(
          file
        );


      const data =
        Object.fromEntries(
          new FormData(e.target)
        );


      data.icon =
        imageUrl;


      button.textContent =
        "⏳ Adding product...";


      const x =
        await api(
          "/api/admin/products",
          {
            method:"POST",

            headers:{
              "Content-Type":"application/json"
            },

            body:JSON.stringify(data)
          }
        );


      if(!x.ok){

        throw new Error(
          x.error ||
          "Product could not be added."
        );

      }


      alert(
        "✅ Product and image added successfully!"
      );


      e.target.reset();


      document
        .getElementById("imagePreview")
        .style.display = "none";


      document
        .getElementById("previewImg")
        .src = "";


      button.disabled = false;

      button.textContent =
        "➕ Add Product";


      await load();


    }catch(error){

      console.error(error);

      alert(
        "❌ " +
        error.message
      );


      button.disabled = false;

      button.textContent =
        "➕ Add Product";

    }

  };


/* =====================================================
   EDIT PRODUCT
   ===================================================== */

async function editProduct(id){

  try{

    const products =
      await api(
        "/api/products"
      );


    const p =
      products.find(
        x => Number(x.id) === Number(id)
      );


    if(!p){

      alert(
        "Product not found."
      );

      return;

    }


    const oldEditor =
      document.getElementById(
        "edit-box-" + id
      );


    if(oldEditor){

      oldEditor.remove();

      return;

    }


    const productElement =
      document.getElementById(
        "product-" + id
      );


    const editor =
      document.createElement("div");


    editor.id =
      "edit-box-" + id;


    editor.className =
      "edit-box";


    editor.innerHTML = `

      <h3>
        ✏️ Edit Product
      </h3>


      <label>
        Product Name
      </label>

      <input
        id="edit-name-${id}"
        value="${escapeHtml(p.name)}"
      >


      <label>
        Category
      </label>

      <input
        id="edit-category-${id}"
        value="${escapeHtml(p.category)}"
      >


      <label>
        Price
      </label>

      <input
        id="edit-price-${id}"
        type="number"
        value="${Number(p.price)}"
      >


      <label>
        Old Price
      </label>

      <input
        id="edit-old-price-${id}"
        type="number"
        value="${Number(p.old_price || 0)}"
      >


      <label>
        Stock
      </label>

      <input
        id="edit-stock-${id}"
        type="number"
        value="${Number(p.stock)}"
      >


      <label>
        📷 Change Product Image
      </label>

      <input
        id="edit-image-${id}"
        type="file"
        accept="image/*"
      >


      ${
        p.icon &&
        (
          p.icon.startsWith("http") ||
          p.icon.startsWith("data:image")
        )

        ?

        `
          <br>

          <img
            id="edit-preview-${id}"
            class="edit-image-preview"
            src="${p.icon}"
          >
        `

        :

        `
          <div
            id="edit-preview-${id}"
            style="
              font-size:50px;
              margin:10px 0;
            "
          >
            ${escapeHtml(p.icon || "🛍️")}
          </div>
        `
      }


      <div class="edit-buttons">

        <button
          class="btn"
          type="button"
          onclick="saveProduct(${id})"
          id="save-edit-${id}"
        >
          💾 Save Changes
        </button>


        <button
          class="cancel-btn"
          type="button"
          onclick="cancelEdit(${id})"
        >
          Cancel
        </button>

      </div>

    `;


    productElement
      .parentNode
      .insertBefore(
        editor,
        productElement.nextSibling
      );


    const imageInput =
      document.getElementById(
        "edit-image-" + id
      );


    imageInput.onchange =
      function(){

        const file =
          this.files[0];

        if(!file)return;


        if(file.size > 10 * 1024 * 1024){

          alert(
            "Image must be under 10MB."
          );

          this.value = "";

          return;

        }


        const reader =
          new FileReader();


        reader.onload =
          function(e){

            const preview =
              document.getElementById(
                "edit-preview-" + id
              );


            if(
              preview &&
              preview.tagName === "IMG"
            ){

              preview.src =
                e.target.result;

            }

          };


        reader.readAsDataURL(file);

      };


  }catch(error){

    console.error(error);

    alert(
      "Could not open editor: " +
      error.message
    );

  }

}


/* =====================================================
   CANCEL EDIT
   ===================================================== */

function cancelEdit(id){

  const editor =
    document.getElementById(
      "edit-box-" + id
    );


  if(editor){

    editor.remove();

  }

}


/* =====================================================
   SAVE PRODUCT
   ===================================================== */

async function saveProduct(id){

  const button =
    document.getElementById(
      "save-edit-" + id
    );


  const name =
    document.getElementById(
      "edit-name-" + id
    ).value.trim();


  const category =
    document.getElementById(
      "edit-category-" + id
    ).value.trim();


  const price =
    document.getElementById(
      "edit-price-" + id
    ).value;


  const old_price =
    document.getElementById(
      "edit-old-price-" + id
    ).value;


  const stock =
    document.getElementById(
      "edit-stock-" + id
    ).value;


  const imageInput =
    document.getElementById(
      "edit-image-" + id
    );


  if(!name){

    alert(
      "Product name is required."
    );

    return;

  }


  if(!category){

    alert(
      "Category is required."
    );

    return;

  }


  if(!price || Number(price) <= 0){

    alert(
      "Please enter a valid price."
    );

    return;

  }


  if(Number(stock) < 0){

    alert(
      "Stock cannot be negative."
    );

    return;

  }


  try{

    button.disabled = true;

    button.textContent =
      "⏳ Saving...";


    let imageUrl = null;


    /* NEW IMAGE */

    if(
      imageInput &&
      imageInput.files &&
      imageInput.files[0]
    ){

      button.textContent =
        "⏳ Uploading new image...";


      imageUrl =
        await uploadToCloudinary(
          imageInput.files[0]
        );

    }


    const data = {

      name:name,

      category:category,

      price:Number(price),

      old_price:Number(old_price) || 0,

      stock:Number(stock)

    };


    /* Only replace image if a new image was selected */

    if(imageUrl){

      data.icon =
        imageUrl;

    }


    button.textContent =
      "⏳ Saving product...";


    const x =
      await api(
        "/api/admin/products/" + id,
        {
          method:"PATCH",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify(data)
        }
      );


    if(!x.ok){

      throw new Error(
        x.error ||
        "Could not update product."
      );

    }


    alert(
      "✅ Product updated successfully!"
    );


    await load();


  }catch(error){

    console.error(error);

    alert(
      "❌ " +
      error.message
    );


    button.disabled = false;

    button.textContent =
      "💾 Save Changes";

  }

}


/* =====================================================
   HIDE PRODUCT
   ===================================================== */

async function del(id){

  if(
    !confirm(
      "Hide this product?"
    )
  ){

    return;

  }


  try{

    const x =
      await api(
        "/api/admin/products/" + id,
        {
          method:"DELETE"
        }
      );


    if(x.ok){

      await load();

    }

  }catch(error){

    alert(
      "❌ " +
      error.message
    );

  }

}


/* =====================================================
   LOGOUT
   ===================================================== */

async function logout(){

  try{

    await api(
      "/api/admin/logout",
      {
        method:"POST"
      }
    );

  }finally{

    location.reload();

  }

}


/* =====================================================
   START
   ===================================================== */

init();

</script>

</body>
</html>
